name: "⚡ Replenish Drafts"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replenish:
    name: "Replenish Drafts"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code

    steps:
      - name: "⬇️ Checkout repository code"
        uses: actions/checkout@v4
        with:
          ref: "main"
          path: "code"

      - name: "⬇️ Checkout memory database"
        uses: actions/checkout@v4
        with:
          ref: "state"
          path: "code/memory"

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Install dependencies"
        run: pip install -r requirements.txt

      - name: "🚀 Run replenishment"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLENISH_ONLY: "true"
        run: python src/run.py

      - name: "💾 Commit memory database"
        if: always()
        run: |
          cd memory
          git config user.name  "linkedin-poster[bot]"
          git config user.email "linkedin-poster[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: replenish drafts queue [skip ci]" && git push)
