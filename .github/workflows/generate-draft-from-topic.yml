name: "✍️ Generate Draft From Topic"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Prompt, topic, or real incident to turn into a draft"
        required: true
        type: string
      index:
        description: "Draft index to replace or generate (default 0)"
        required: false
        default: "0"
        type: string
      hook_formula:
        description: "Viral Hook Formula (F1-F20 or None)"
        required: false
        default: "None"
        type: string
      founder_angle:
        description: "Founder Strategy Angle"
        required: false
        default: "None"
        type: string
      tone:
        description: "Post tone"
        required: false
        default: "Auto"
        type: string

permissions:
  contents: write

jobs:
  generate:
    name: "Generate Draft"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code

    steps:
      - name: "⬇️ Checkout repository code"
        uses: actions/checkout@v4
        with:
          ref: "main"
          path: "code"

      - name: "⬇️ Checkout memory database"
        uses: actions/checkout@v4
        with:
          ref: "state"
          path: "code/memory"

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Install dependencies"
        run: pip install google-genai requests python-dotenv

      - name: "✍️ Generate topic-based draft"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC_INPUT: ${{ github.event.inputs.topic }}
          TARGET_INDEX: ${{ github.event.inputs.index }}
          HOOK_FORMULA: ${{ github.event.inputs.hook_formula }}
          FOUNDER_ANGLE: ${{ github.event.inputs.founder_angle }}
          TONE_INPUT: ${{ github.event.inputs.tone }}
        run: |
          python -c "
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, '.')

          from src.ai_generator import AIGenerator
          from src.memory_manager import MemoryManager

          topic = os.environ.get('TOPIC_INPUT', '').strip()
          raw_idx = os.environ.get('TARGET_INDEX', '0').strip()
          try:
              index = int(raw_idx)
          except ValueError:
              index = 0

          hook_formula = os.environ.get('HOOK_FORMULA', 'None').strip() or 'None'
          founder_angle = os.environ.get('FOUNDER_ANGLE', 'None').strip() or 'None'
          tone = os.environ.get('TONE_INPUT', 'Auto').strip() or 'Auto'

          mem = MemoryManager()
          queue = mem.load_posts_queue()
          approved = queue.get('approved', [])

          summary = mem.build_full_context_summary()
          compact = mem.load_compact_profile()

          blacklist = mem.load_recent_posts_history_text(limit=15)
          for idx, item in enumerate(approved):
              if idx == index:
                  continue
              text = item.get('post_text', '').strip()
              if text:
                  blacklist.append(text)

          ai = AIGenerator()
          batch = ai.generate_post_batch(
              topic=topic,
              tone=tone,
              compact_profile=compact,
              recent_context=summary.get('recent_context', ''),
              past_posts=blacklist,
              batch_size=1,
              topic_is_source_of_truth=True,
              hook_formula=hook_formula,
              founder_angle=founder_angle,
          )

          if not batch:
              raise RuntimeError('Gemini generation returned 0 valid drafts.')

          new_post = {
              'post_text': batch[0]['post_text'],
              'reasoning': batch[0].get('reasoning', 'Generated from dashboard topic prompt.')
          }

          if 0 <= index < len(approved):
              approved[index] = new_post
          else:
              approved.insert(0, new_post)

          queue['approved'] = approved
          mem.save_posts_queue(queue)
          print(f'[generate-topic] Updated approved draft at index {index}.')
          "

      - name: "💾 Commit updated queue"
        run: |
          cd memory
          git config user.name  "linkedin-poster[bot]"
          git config user.email "linkedin-poster[bot]@users.noreply.github.com"
          git add posts_queue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: generate draft from topic [skip ci]" && git push)

      - name: "🔔 Notify Discord on action failure"
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          try:
              from src.discord_notifier import notify_post_error
              notify_post_error('GitHub Actions generate-draft-from-topic workflow failed. Check workflow run logs.')
          except Exception as e:
              print(f'Failed sending Discord failure alert: {e}')
          "
