name: "🧠 Add Context / Memory"

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      context:
        description: |
          Your raw thoughts, recent wins, learnings, or events.
          Write freely — don't worry about formatting. The AI will structure it.
          Examples:
            "Just shipped the auth system. Took 3 weeks debugging JWT refresh tokens.
             Learned that silent token rotation is the move. Got 2 new beta users today."
          Or:
            "Had a meeting that made me realise most devs don't know about X.
             We use X at work and it saves us hours every week."
        required: true
        type: string
      date:
        description: "Date for this context (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
      update_achievements:
        description: "Also add to achievements.md? (paste the achievement text below)"
        required: false
        type: string

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  save-context:
    name: "Save Context to Memory"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Install dependencies"
        run: pip install python-dotenv

      - name: "💾 Save context file"
        env:
          CONTEXT:             ${{ github.event.inputs.context }}
          DATE_OVERRIDE:       ${{ github.event.inputs.date }}
          UPDATE_ACHIEVEMENTS: ${{ github.event.inputs.update_achievements }}
        run: |
          python - << 'EOF'
          import os
          import sys
          from pathlib import Path
          from datetime import date

          sys.path.insert(0, ".")
          from src.memory_manager import MemoryManager

          mem = MemoryManager()

          # Save context
          context_text = os.getenv("CONTEXT", "").strip()
          date_override = os.getenv("DATE_OVERRIDE", "").strip()
          if context_text:
              saved = mem.save_context(context_text, for_date=date_override or None)
              print(f"✓ Context saved: {saved}")
          else:
              print("No context provided — nothing to save.")
              sys.exit(1)

          # Optionally append to achievements
          achievement = os.getenv("UPDATE_ACHIEVEMENTS", "").strip()
          if achievement:
              ach_path = Path("memory/achievements.md")
              existing = ach_path.read_text(encoding="utf-8") if ach_path.exists() else ""
              # Append with today's date prefix
              today = date.today().isoformat()
              new_entry = f"\n- [{today}] {achievement}"
              ach_path.write_text(existing.rstrip() + new_entry + "\n", encoding="utf-8")
              print(f"✓ Achievement appended to achievements.md")
          EOF

      - name: "📤 Commit context to repository"
        run: |
          git config user.name  "linkedin-poster[bot]"
          git config user.email "linkedin-poster[bot]@users.noreply.github.com"
          git add memory/contexts/ memory/achievements.md || true
          git diff --staged --quiet && echo "Nothing to commit." || \
            git commit -m "feat: add context for $(date -u +%Y-%m-%d) [skip ci]"
          git push || true

      - name: "✅ Summary"
        run: |
          echo "Context saved! The daily poster will use it tomorrow (or trigger it manually now)."
          echo ""
          echo "Context files in memory/contexts/:"
          ls -la memory/contexts/ 2>/dev/null || echo "  (directory empty)"
