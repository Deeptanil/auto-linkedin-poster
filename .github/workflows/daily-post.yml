name: "📅 Daily LinkedIn Post"

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  # Auto: runs 3x daily at 9:00 AM, 1:00 PM, and 6:00 PM IST to check/retry posting
  schedule:
    # --- Morning Peak/Retry Window (7:30 AM - 11:15 AM IST) ---
    - cron: "0 2 * * *"    # 7:30 AM IST
    - cron: "45 2 * * *"   # 8:15 AM IST
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "15 4 * * *"   # 9:45 AM IST
    - cron: "0 5 * * *"    # 10:30 AM IST
    - cron: "45 5 * * *"   # 11:15 AM IST
    
    # --- Afternoon & Evening Fallbacks ---
    - cron: "30 8 * * *"   # 2:00 PM IST
    - cron: "0 13 * * *"   # 6:30 PM IST

  # Manual: trigger with optional overrides from GitHub UI
  workflow_dispatch:
    inputs:
      context:
        description: "What happened recently? (raw thoughts, wins, learnings)"
        required: false
        type: string
      tone:
        description: "Post tone"
        required: false
        type: choice
        default: "Auto"
        options:
          - Auto
          - Storytelling
          - Technical
          - Professional
          - "Thought Leadership"
          - "Casual/Conversational"
      extra_notes:
        description: "Extra instructions (e.g. 'keep it under 200 words', 'mention the product launch')"
        required: false
        type: string
      dry_run:
        description: "Dry run — generate post but don't publish it"
        required: false
        type: boolean
        default: false
      force:
        description: "Force post even if no context file exists"
        required: false
        type: boolean
        default: false
      replenish_only:
        description: "Only replenish pending drafts, do not publish"
        required: false
        type: boolean
        default: false

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write    # needed to commit post_history.json back to repo

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  post:
    name: "Generate & Post"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code

    steps:
      # 1. Checkout code (main branch) and memory database (state branch)
      - name: "⬇️ Checkout repository code"
        uses: actions/checkout@v4
        with:
          ref: "main"
          path: "code"

      - name: "⬇️ Checkout memory database"
        uses: actions/checkout@v4
        with:
          ref: "state"
          path: "code/memory"

      # 2. Set up Python
      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: "📦 Install dependencies"
        run: pip install -r requirements.txt

      # 4. Run the posting script
      - name: "🚀 Generate & publish post"
        env:
          # Gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # LinkedIn
          LINKEDIN_ACCESS_TOKEN:         ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN:        ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_TOKEN_EXPIRY:         ${{ secrets.LINKEDIN_TOKEN_EXPIRY }}
          LINKEDIN_REFRESH_TOKEN_EXPIRY: ${{ secrets.LINKEDIN_REFRESH_TOKEN_EXPIRY }}
          LINKEDIN_CLIENT_ID:            ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET:        ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_MEMBER_URN:           ${{ secrets.LINKEDIN_MEMBER_URN }}
          # Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # GitHub (auto-provided, used for secret auto-update)
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Workflow inputs
          CONTEXT:     ${{ github.event.inputs.context }}
          TONE:        ${{ github.event.inputs.tone || 'Auto' }}
          EXTRA_NOTES: ${{ github.event.inputs.extra_notes }}
          DRY_RUN:     ${{ github.event.inputs.dry_run || 'false' }}
          FORCE:       ${{ github.event.inputs.force || 'false' }}
          REPLENISH_ONLY: ${{ github.event.inputs.replenish_only || 'false' }}
        run: python src/run.py

      # 5. Commit queue and history back to the state branch
      # Only runs when the script succeeded (not on fast-exit "already posted" skips)
      - name: "💾 Commit post history & queue"
        if: success()
        run: |
          cd memory
          git config user.name  "linkedin-poster[bot]"
          git config user.email "linkedin-poster[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update post history & queue [skip ci]" && git push)

      # 6. Fallback Discord failure notification
      - name: "🔔 Notify Discord on action failure"
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          try:
              from src.discord_notifier import notify_post_error
              notify_post_error('GitHub Actions daily-post workflow encountered an execution failure. Check workflow run logs for details.')
          except Exception as e:
              print(f'Failed sending Discord failure alert: {e}')
          "
